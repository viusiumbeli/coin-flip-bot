services:
  postgres:
    image: postgres:18-alpine
    container_name: coinflip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coinflipbot
      POSTGRES_USER: coinflipuser
      POSTGRES_PASSWORD: coinflippass
    # No external port - only accessible within coinflip-network
    volumes:
      # PG18+ changed PGDATA to /var/lib/postgresql (version-specific subdirs)
      - coinflip-data:/var/lib/postgresql
    networks:
      - coinflip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinflipuser -d coinflipbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: coin-flip-bot
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: coinflip-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/coinflipbot
      SPRING_R2DBC_USERNAME: coinflipuser
      SPRING_R2DBC_PASSWORD: coinflippass
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/coinflipbot
      SPRING_FLYWAY_USER: coinflipuser
      SPRING_FLYWAY_PASSWORD: coinflippass
    networks:
      - coinflip-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  coinflip-network:
    name: coinflip-network
    driver: bridge

volumes:
  coinflip-data:
    name: coinflip-data
