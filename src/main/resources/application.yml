server:
  port: 8080

spring:
  application:
    name: coin-flip-bot
  datasource:
    url: jdbc:postgresql://localhost:5432/coinflipbot
    driver-class-name: org.postgresql.Driver
    username: coinflipuser
    password: coinflippass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

logging:
  level:
    root: INFO
    com.trading.coinflip: INFO
    org.hibernate.SQL: WARN

backtest:
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
  timeframes:
    - ONE_HOUR
    - FOUR_HOURS
    - ONE_DAY
  initial-capital: 1000
  risk-per-trade: 1.0
  atr-period: 10
  atr-multiplier: 3.0
  transaction-cost-percent: 0.1
  max-concurrent-positions: 5
  start-date: 2020-01-01T00:00:00Z
