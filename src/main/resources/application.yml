server:
  port: 8080

spring:
  application:
    name: coin-flip-bot
  # Flyway uses its own JDBC URL (DataSource auto-config is disabled when R2DBC is present)
  flyway:
    url: jdbc:postgresql://localhost:5432/coinflipbot
    user: coinflipuser
    password: coinflippass
  # R2DBC for application
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/coinflipbot
    username: coinflipuser
    password: coinflippass
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

logging:
  level:
    root: INFO
    com.trading.coinflip: INFO
    org.hibernate.SQL: WARN

backtest:
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
  timeframes:
    - ONE_MINUTE
    - ONE_HOUR
    - FOUR_HOURS
    - ONE_DAY
  initial-capital: 10000
  start-date: 2020-01-01T00:00:00Z

  trading:
    risk-per-trade: 1.0
    atr-period: 10
    atr-multiplier: 3.0
    transaction-cost-percent: 0.0
    max-concurrent-positions: 5
    max-position-size-percent: 20
    entry-frequency: 2

  experiment:
    sync-backtest-limit: 1000000
    async-backtest-limit: 10000000

  async:
    parallelism-min: 4
    parallelism-max: 32
    channel-capacity: 1000
    batch-size: 1000
    shutdown-timeout-ms: 30000
    progress-log-interval: 10000

  api:
    max-page-size: 1000
    http-timeout-ms: 30000
    rate-limit-delay-ms: 0

live:
  enabled: true
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - XAUTUSDT
    - SOLUSDT
  initial-capital: 10000
  prefetch-candle-count: 20
  balance-snapshot-interval-minutes: 60

  # Exchange selection: BINANCE or BYBIT
  exchange: BINANCE

  # Common WebSocket settings
  reconnect-delay-ms: 5000
  max-reconnect-attempts: 10
  heartbeat-interval-ms: 30000

  # Binance URLs
  binance-websocket-url: wss://stream.binance.com:9443/ws
  binance-rest-url: https://api.binance.com

  # ByBit URLs (Linear/USDT perpetuals)
  bybit-websocket-url: wss://stream.bybit.com/v5/public/linear
  bybit-rest-url: https://api.bybit.com

  # Bybit trading credentials (env vars BYBIT_API_KEY, BYBIT_API_SECRET take precedence)
  bybit-api-key: ${BYBIT_API_KEY:}
  bybit-api-secret: ${BYBIT_API_SECRET:}
  bybit-demo: true  # true = demo (api-demo.bybit.com), false = mainnet
  bybit-demo-rest-url: https://api-demo.bybit.com

  # Real order execution - when true, places actual orders on exchange (uses demo if bybit-demo=true)
  execute-real-orders: true
  default-leverage: 1
