spring:
  application:
    name: coin-flip-bot
  datasource:
    url: jdbc:h2:file:./data/coinflipbot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.trading.coinflip: INFO
    org.hibernate.SQL: WARN

backtest:
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
  timeframes:
    - ONE_HOUR
    - FOUR_HOURS
    - ONE_DAY
  initial-capital: 10000
  risk-per-trade: 1.0
  atr-period: 10
  atr-multiplier: 3.0
  transaction-cost-percent: 0.1
  max-concurrent-positions: 5
  start-date: 2020-01-01T00:00:00Z
