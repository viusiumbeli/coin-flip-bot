<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Trading Bot - Backtest System</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="container">
        <div id="app-header"></div>

        <div class="card">
            <h2>Run Backtest</h2>

            <div class="config-info" id="configInfo" style="display: none;">
                Loading configuration...
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="symbol">Symbol</label>
                    <select id="symbol">
                        <option value="">Loading...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="timeframe">Timeframe</label>
                    <select id="timeframe">
                        <option value="">Loading...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="datetime-local" id="startDate" max="9999-12-31T23:59" required>
                </div>

                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input type="datetime-local" id="endDate" max="9999-12-31T23:59" required>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="runBacktest()" id="runBtn">Run Backtest</button>
            </div>
        </div>

        <div id="loading" class="card loading" style="display: none;">
            <div class="spinner"></div>
            <p>Running backtest... This may take a few moments.</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="results" class="results">
            <!-- Results will be inserted here -->
        </div>
    </div>

    <script src="js/components/theme.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/loading.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/formatters.js"></script>
    <script>
        initHeader('backtest');

        const API_BASE = '/api/backtest';

        // Load configuration on page load
        async function loadConfig() {
            try {
                const [configRes, symbolsRes, dbSymbolsRes] = await Promise.all([
                    fetch(`${API_BASE}/config`),
                    fetch(`${API_BASE}/symbols`),
                    fetch('/api/candles/distinct-symbols')
                ]);

                const config = await configRes.json();
                const symbols = await symbolsRes.json();
                const dbSymbols = await dbSymbolsRes.json();

                // Merge configured symbols with DB symbols (unique, config first)
                const allSymbols = [...new Set([...symbols.symbols, ...dbSymbols])];

                // Populate symbols dropdown
                const symbolSelect = document.getElementById('symbol');
                symbolSelect.innerHTML = allSymbols.map(s =>
                    `<option value="${s}">${s}</option>`
                ).join('');

                // Populate timeframes dropdown
                const timeframeSelect = document.getElementById('timeframe');
                timeframeSelect.innerHTML = symbols.timeframes.map(t =>
                    `<option value="${t}">${t}</option>`
                ).join('');

                // Show config info
                const configInfo = document.getElementById('configInfo');
                configInfo.style.display = 'block';
                configInfo.innerHTML = `
                    <strong>Configuration:</strong>
                    Initial Capital: $${formatNumber(config.initialCapital)} |
                    Risk per Trade: ${config.riskPerTrade}% |
                    ATR Period: ${config.atrPeriod} |
                    ATR Multiplier: ${config.atrMultiplier} |
                    Max Positions: ${config.maxConcurrentPositions}
                `;

                // Pre-fill date fields with defaults
                document.getElementById('startDate').value = '2020-01-01T00:00';
                document.getElementById('endDate').value = new Date().toISOString().slice(0, 16);
            } catch (error) {
                showError('Failed to load configuration: ' + error.message);
            }
        }

        async function runBacktest() {
            const symbol = document.getElementById('symbol').value;
            const timeframe = document.getElementById('timeframe').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!symbol || !timeframe) {
                showError('Please select a symbol and timeframe');
                return;
            }

            if (!startDate || !endDate) {
                showError('Please select start and end dates');
                return;
            }

            setLoading(true);
            hideError();
            hideResults();

            try {
                const response = await fetch(`${API_BASE}/run`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        symbol,
                        timeframe,
                        startDate: toUTCISOString(startDate),
                        endDate: toUTCISOString(endDate)
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const result = await response.json();
                displayResults([result]);
            } catch (error) {
                showError('Failed to run backtest: ' + error.message);
            } finally {
                setLoading(false);
            }
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            results.forEach(result => {
                const resultCard = createResultCard(result);
                resultsDiv.appendChild(resultCard);
            });

            resultsDiv.classList.add('show');
        }

        function createResultCard(result) {
            const card = document.createElement('div');
            card.className = 'card';

            const isProfit = result.totalReturnPercent >= 0;

            card.innerHTML = `
                <h2 style="margin-bottom: 20px; color: ${isProfit ? 'var(--success-color)' : 'var(--danger-color)'};">
                    ${result.symbol} - ${result.timeframe}
                    <span style="float: right; font-size: 18px;">
                        ${formatNumber(result.totalReturnPercent)}% Return
                    </span>
                </h2>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Initial Capital</div>
                        <div class="metric-value" title="$${formatNumber(result.initialCapital)}">$${formatNumber(result.initialCapital)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Final Capital</div>
                        <div class="metric-value ${isProfit ? 'positive' : 'negative'}" title="$${formatNumber(result.finalCapital)}">
                            $${formatNumber(result.finalCapital)}
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Total Return</div>
                        <div class="metric-value ${isProfit ? 'positive' : 'negative'}" title="$${formatNumber(result.totalReturn)}">
                            $${formatNumber(result.totalReturn)}
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Max Drawdown</div>
                        <div class="metric-value negative">${formatNumber(result.maxDrawdownPercent)}%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Win Rate</div>
                        <div class="metric-value">${formatNumber(result.winRate)}%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Profit Factor</div>
                        <div class="metric-value">${formatNumber(result.profitFactor)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Sharpe Ratio</div>
                        <div class="metric-value">${formatNumber(result.sharpeRatio)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Total Trades</div>
                        <div class="metric-value">${result.totalTrades}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Winning Trades</div>
                        <div class="metric-value positive">${result.winningTrades}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Losing Trades</div>
                        <div class="metric-value negative">${result.losingTrades}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Average Win</div>
                        <div class="metric-value positive" title="$${formatNumber(result.averageWin)}">$${formatNumber(result.averageWin)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Average Loss</div>
                        <div class="metric-value negative" title="$${formatNumber(result.averageLoss)}">$${formatNumber(result.averageLoss)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Largest Win</div>
                        <div class="metric-value positive" title="$${formatNumber(result.largestWin)}">$${formatNumber(result.largestWin)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Largest Loss</div>
                        <div class="metric-value negative" title="$${formatNumber(result.largestLoss)}">$${formatNumber(result.largestLoss)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Buy & Hold Return</div>
                        <div class="metric-value" title="$${formatNumber(result.buyAndHoldReturn)}">
                            ${formatNumber(result.buyAndHoldReturnPercent)}% ($${formatNumber(result.buyAndHoldReturn)})
                        </div>
                    </div>
                </div>

                <div class="trades-section">
                    <h3>Trade History (${result.trades.length} trades)</h3>
                    <div class="trades-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Side</th>
                                    <th>Entry Time</th>
                                    <th>Entry Price</th>
                                    <th>Balance Before Open</th>
                                    <th>Size</th>
                                    <th>Balance After Open</th>
                                    <th>Exit Time</th>
                                    <th>Exit Price</th>
                                    <th>Balance Before Close</th>
                                    <th>P&L</th>
                                    <th>P&L %</th>
                                    <th>Balance After Close</th>
                                    <th>Exit Reason</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${result.trades.map(trade => `
                                    <tr>
                                        <td>${trade.id}</td>
                                        <td>${trade.side}</td>
                                        <td>${trade.entryTime}</td>
                                        <td>$${formatNumber(trade.entryPrice)}</td>
                                        <td title="$${formatNumber(trade.balanceBeforeOpen)}">$${formatNumber(trade.balanceBeforeOpen)}</td>
                                        <td>${formatSize(trade.positionSize)}</td>
                                        <td title="$${formatNumber(trade.balanceAfterOpen)}">$${formatNumber(trade.balanceAfterOpen)}</td>
                                        <td>${trade.exitTime}</td>
                                        <td>$${formatNumber(trade.exitPrice)}</td>
                                        <td title="$${formatNumber(trade.balanceBeforeClose)}">$${formatNumber(trade.balanceBeforeClose)}</td>
                                        <td class="${trade.profitLoss >= 0 ? 'trade-profit' : 'trade-loss'}">
                                            $${formatNumber(trade.profitLoss)}
                                        </td>
                                        <td class="${trade.profitLossPercent >= 0 ? 'trade-profit' : 'trade-loss'}">
                                            ${formatNumber(trade.profitLossPercent)}%
                                        </td>
                                        <td title="$${formatNumber(trade.balanceAfterClose)}">$${formatNumber(trade.balanceAfterClose)}</td>
                                        <td>${trade.exitReason}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            return card;
        }

        function setLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('runBtn').disabled = show;
        }

        function hideResults() {
            document.getElementById('results').classList.remove('show');
        }

        // Load config on page load
        loadConfig();
    </script>
</body>
</html>
