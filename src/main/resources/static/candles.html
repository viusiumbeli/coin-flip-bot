<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Trading Bot - Candles Management</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="container container-narrow">
        <div id="app-header"></div>

        <div class="card">
            <div class="button-group" style="margin-bottom: 20px;">
                <button class="btn-primary" style="flex: 0; min-width: 180px" onclick="syncAll()" id="syncAllBtn">Sync All Data</button>
                <button class="btn-primary" style="flex: 0; min-width: 180px" onclick="refreshStatus()" id="refreshBtn">Refresh Status</button>
            </div>

            <div id="error" class="error" style="display: none;"></div>

            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Timeframe</th>
                            <th>Candle Count</th>
                            <th>Earliest</th>
                            <th>Latest</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

        <div class="card">
            <h2>Deribit Options</h2>
            <div class="grid-2" style="margin-bottom: 15px;">
                <div class="form-group">
                    <label for="deribitCurrency">Currency</label>
                    <select id="deribitCurrency">
                        <option value="ETH">ETH</option>
                        <option value="BTC">BTC</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn-primary" onclick="loadDeribitInstruments()" id="loadInstrumentsBtn">Load Instruments</button>
                </div>
            </div>

            <div id="deribitError" class="error" style="display: none;"></div>

            <div id="deribitSearch" style="display: none; margin-bottom: 10px;">
                <input type="text" id="instrumentSearch" placeholder="Filter instruments (e.g. 2200-C, MAR26)..." oninput="filterInstruments()" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color);">
            </div>

            <div class="data-table" id="deribitTableContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Instrument</th>
                            <th>Type</th>
                            <th>Strike</th>
                            <th>Expiration</th>
                            <th>Timeframe</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="deribitTableBody">
                    </tbody>
                </table>
            </div>
            <div id="deribitCount" style="margin-top: 8px; color: var(--text-secondary); font-size: 13px;"></div>
        </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <p id="loadingText">Syncing data...</p>
        </div>
    </div>

    <script src="js/components/theme.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/loading.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/formatters.js"></script>
    <script>
        initHeader('candles');

        const API_BASE = '/api/candles';

        async function loadStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                if (!response.ok) throw new Error('Failed to load status');

                const statusList = await response.json();
                renderTable(statusList);
            } catch (error) {
                showError('Failed to load data status: ' + error.message);
            }
        }

        function renderTable(statusList) {
            const tbody = document.getElementById('dataTableBody');

            if (statusList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No configured symbols found</td></tr>';
                return;
            }

            tbody.innerHTML = statusList.map(status => {
                const statusClass = getStatusClass(status);
                const statusText = getStatusText(status);

                return `
                    <tr id="row-${status.symbol}-${status.timeframe}">
                        <td><strong>${status.symbol}</strong></td>
                        <td>${status.timeframe}</td>
                        <td>${formatNumber(status.candleCount)}</td>
                        <td>${formatDateValue(status.earliestCandle)}</td>
                        <td>${formatDateValue(status.latestCandle)}</td>
                        <td class="${statusClass}">${statusText}</td>
                        <td>
                            <button class="btn-primary btn-small"
                                    onclick="syncSingle('${status.symbol}', '${status.timeframe}')"
                                    id="btn-${status.symbol}-${status.timeframe}">
                                Sync
                            </button>
                            <div id="result-${status.symbol}-${status.timeframe}" class="sync-result"></div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStatusClass(status) {
            if (status.candleCount === 0) return 'status-nodata';
            if (status.hoursOutdated === null || status.hoursOutdated <= 0) return 'status-uptodate';
            return 'status-outdated';
        }

        function getStatusText(status) {
            if (status.candleCount === 0) return 'No data';
            if (status.hoursOutdated === null || status.hoursOutdated <= 0) return 'Up to date';

            const hours = status.hoursOutdated;
            if (hours < 24) return `${hours}h behind`;
            const days = Math.floor(hours / 24);
            return `${days}d behind`;
        }

        function formatDateValue(dateString) {
            return dateString || '-';
        }

        async function syncSingle(symbol, timeframe) {
            const btn = document.getElementById(`btn-${symbol}-${timeframe}`);
            const resultDiv = document.getElementById(`result-${symbol}-${timeframe}`);

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-small"></span>Syncing...';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol, timeframe })
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.className = 'sync-result success';
                    resultDiv.textContent = `+${result.newCandlesAdded} candles`;
                    refreshStatus();
                } else {
                    resultDiv.className = 'sync-result error';
                    resultDiv.textContent = result.error || 'Failed';
                }
            } catch (error) {
                resultDiv.className = 'sync-result error';
                resultDiv.textContent = error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sync';
            }
        }

        async function syncAll() {
            const syncAllBtn = document.getElementById('syncAllBtn');
            const refreshBtn = document.getElementById('refreshBtn');

            syncAllBtn.disabled = true;
            refreshBtn.disabled = true;
            showLoadingOverlay('Syncing all data... This may take a few minutes.');

            // Disable all individual sync buttons
            document.querySelectorAll('[id^="btn-"]').forEach(btn => btn.disabled = true);

            try {
                const response = await fetch(`${API_BASE}/sync-all`, {
                    method: 'POST'
                });

                const results = await response.json();

                // Show results for each
                results.forEach(result => {
                    const resultDiv = document.getElementById(`result-${result.symbol}-${result.timeframe}`);
                    if (resultDiv) {
                        if (result.success) {
                            resultDiv.className = 'sync-result success';
                            resultDiv.textContent = `+${result.newCandlesAdded} candles`;
                        } else {
                            resultDiv.className = 'sync-result error';
                            resultDiv.textContent = result.error || 'Failed';
                        }
                    }
                });

                // Refresh the table to show updated counts
                await loadStatus();
            } catch (error) {
                showError('Failed to sync all: ' + error.message);
            } finally {
                syncAllBtn.disabled = false;
                refreshBtn.disabled = false;
                hideLoadingOverlay();
                document.querySelectorAll('[id^="btn-"]').forEach(btn => btn.disabled = false);
            }
        }

        async function refreshStatus() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Refreshing...';

            await loadStatus();

            refreshBtn.disabled = false;
            refreshBtn.textContent = 'Refresh Status';
        }

        // --- Deribit Options ---

        let deribitInstruments = [];

        async function loadDeribitInstruments() {
            const currency = document.getElementById('deribitCurrency').value;
            const btn = document.getElementById('loadInstrumentsBtn');
            const errDiv = document.getElementById('deribitError');

            btn.disabled = true;
            btn.textContent = 'Loading...';
            errDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/deribit/instruments?currency=${currency}`);
                if (!response.ok) throw new Error('Failed to load instruments');

                deribitInstruments = await response.json();

                // Sort by expiration, then strike
                deribitInstruments.sort((a, b) => {
                    const expDiff = new Date(a.expirationTimestamp) - new Date(b.expirationTimestamp);
                    if (expDiff !== 0) return expDiff;
                    return a.strike - b.strike;
                });

                document.getElementById('deribitSearch').style.display = 'block';
                document.getElementById('deribitTableContainer').style.display = 'block';
                document.getElementById('instrumentSearch').value = '';
                renderDeribitTable(deribitInstruments);
            } catch (error) {
                errDiv.textContent = 'Failed to load instruments: ' + error.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Load Instruments';
            }
        }

        function filterInstruments() {
            const query = document.getElementById('instrumentSearch').value.toUpperCase();
            const filtered = deribitInstruments.filter(i =>
                i.instrumentName.toUpperCase().includes(query)
            );
            renderDeribitTable(filtered);
        }

        function renderDeribitTable(instruments) {
            const tbody = document.getElementById('deribitTableBody');
            const countDiv = document.getElementById('deribitCount');

            countDiv.textContent = `${instruments.length} instruments${instruments.length !== deribitInstruments.length ? ` (filtered from ${deribitInstruments.length})` : ''}`;

            if (instruments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">No instruments found</td></tr>';
                return;
            }

            // Show max 100 rows for performance
            const display = instruments.slice(0, 100);

            tbody.innerHTML = display.map(inst => `
                <tr>
                    <td><strong>${inst.instrumentName}</strong></td>
                    <td>${inst.optionType.toUpperCase()}</td>
                    <td>${formatNumber(inst.strike)}</td>
                    <td>${inst.expirationTimestamp.split('T')[0]}</td>
                    <td>
                        <select id="tf-${inst.instrumentName}" style="padding: 4px;">
                            <option value="1h">1h</option>
                            <option value="1m">1m</option>
                            <option value="4h">4h</option>
                            <option value="1d">1d</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-primary btn-small" onclick="syncDeribit('${inst.instrumentName}')" id="dbtn-${CSS.escape(inst.instrumentName)}">Sync</button>
                        <span id="dresult-${CSS.escape(inst.instrumentName)}" class="sync-result"></span>
                    </td>
                </tr>
            `).join('');

            if (instruments.length > 100) {
                tbody.innerHTML += `<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">... and ${instruments.length - 100} more. Use filter to narrow down.</td></tr>`;
            }
        }

        async function syncDeribit(instrumentName) {
            const escapedName = CSS.escape(instrumentName);
            const btn = document.getElementById(`dbtn-${escapedName}`);
            const resultSpan = document.getElementById(`dresult-${escapedName}`);
            const tfSelect = document.getElementById(`tf-${instrumentName}`);
            const timeframe = tfSelect ? tfSelect.value : '1h';

            btn.disabled = true;
            btn.textContent = 'Syncing...';
            resultSpan.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        symbol: instrumentName,
                        timeframe: timeframe,
                        exchange: 'DERIBIT'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    resultSpan.className = 'sync-result success';
                    resultSpan.textContent = `+${result.newCandlesAdded} candles`;
                } else {
                    resultSpan.className = 'sync-result error';
                    resultSpan.textContent = result.error || 'Failed';
                }
            } catch (error) {
                resultSpan.className = 'sync-result error';
                resultSpan.textContent = error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sync';
            }
        }

        // Load status on page load
        loadStatus();
    </script>
</body>
</html>
